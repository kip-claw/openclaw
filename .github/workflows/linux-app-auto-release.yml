name: Linux App Auto Release Trigger

on:
  release:
    types:
      - published

permissions:
  actions: write

jobs:
  dispatch-linux-app-release:
    if: github.repository == 'openclaw/openclaw' && !github.event.release.prerelease
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Validate release tag is a stable release
        id: check_tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          if [[ ! "${RELEASE_TAG}" =~ ^v[0-9]{4}\.[1-9][0-9]*\.[1-9][0-9]*(-[1-9][0-9]*)?$ ]]; then
            echo "Release tag ${RELEASE_TAG} is not a stable release tag; skipping Linux app dispatch."
            echo "is_stable=false" >> "$GITHUB_OUTPUT"
          else
            echo "is_stable=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger Linux App Release Request
        if: steps.check_tag.outputs.is_stable == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          gh workflow run linux-app-release-request.yml \
            --repo "${GITHUB_REPOSITORY}" \
            --field tag="${RELEASE_TAG}"
